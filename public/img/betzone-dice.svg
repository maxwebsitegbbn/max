<svg viewBox="0 0 450 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="diceBg" cx="50%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#460014" />
      <stop offset="45%" stop-color="#24000A" />
      <stop offset="85%" stop-color="#0E0004" />
      <stop offset="100%" stop-color="#050002" />
    </radialGradient>

    <!-- 3D Dice Face Gradients (Pinkish Red Plastic/Ceramic) -->
    <linearGradient id="diceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8EC" />
      <stop offset="40%" stop-color="#FFA8BA" />
      <stop offset="100%" stop-color="#FF3864" />
    </linearGradient>

    <linearGradient id="diceLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3360" />
      <stop offset="100%" stop-color="#BD0027" />
    </linearGradient>

    <linearGradient id="diceRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A4B" />
      <stop offset="100%" stop-color="#7A0018" />
    </linearGradient>

    <!-- Deep Inset Pips Radial Shadow -->
    <radialGradient id="pipHole" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5E0013" />
      <stop offset="70%" stop-color="#36000B" />
      <stop offset="100%" stop-color="#140004" />
    </radialGradient>

    <!-- Swirling Neon Laser Trail -->
    <linearGradient id="swirlTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A4B" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#FF6688" />
      <stop offset="80%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FF0033" stop-opacity="0.2" />
    </linearGradient>

    <filter id="diceShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#FF0033" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Card Backdrop -->
  <rect width="450" height="600" rx="28" fill="url(#diceBg)" />
  <rect width="450" height="600" rx="28" stroke="#FF1E46" stroke-width="1.8" stroke-opacity="0.3" />

  <!-- Cyber Grid Floor in Background -->
  <g stroke="#FF1A4B" stroke-opacity="0.16" stroke-width="1.2">
    <!-- Horizontal Grid Lines -->
    <line x1="30" y1="120" x2="420" y2="120" />
    <line x1="30" y1="180" x2="420" y2="180" />
    <line x1="30" y1="240" x2="420" y2="240" />
    <line x1="30" y1="300" x2="420" y2="300" />
    <line x1="30" y1="350" x2="420" y2="350" />
    <!-- Vertical Perspective Lines -->
    <line x1="80" y1="80" x2="80" y2="370" />
    <line x1="150" y1="80" x2="150" y2="370" />
    <line x1="225" y1="80" x2="225" y2="370" />
    <line x1="300" y1="80" x2="300" y2="370" />
    <line x1="370" y1="80" x2="370" y2="370" />
  </g>

  <!-- Swirling Neon Light Trail (Behind lower die, around top die) -->
  <path d="M 80 280
           C 20 160, 100 60, 240 85
           C 380 110, 420 250, 320 330
           C 240 390, 140 370, 95 300"
        fill="none"
        stroke="url(#swirlTrail)"
        stroke-width="14"
        stroke-linecap="round"
        filter="blur(8px)" />
  <path d="M 80 280
           C 20 160, 100 60, 240 85
           C 380 110, 420 250, 320 330
           C 240 390, 140 370, 95 300"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.85" />

  <!-- ==================== UPPER DIE ==================== -->
  <g transform="translate(100, 75) rotate(-18)" filter="url(#diceShadow)">
    <!-- Top Face -->
    <polygon points="55,10 100,32 55,54 10,32" fill="url(#diceTop)" stroke="#FFF" stroke-width="1.2" />
    <!-- Left Face -->
    <polygon points="10,32 55,54 55,105 10,83" fill="url(#diceLeft)" stroke="#FFF" stroke-width="1.2" />
    <!-- Right Face -->
    <polygon points="55,54 100,32 100,83 55,105" fill="url(#diceRight)" stroke="#FFF" stroke-width="1.2" />

    <!-- Pips Top Face -->
    <circle cx="55" cy="32" r="4.5" fill="url(#pipHole)" />
    <!-- Pips Left Face (2) -->
    <circle cx="28" cy="55" r="4.5" fill="url(#pipHole)" />
    <circle cx="38" cy="78" r="4.5" fill="url(#pipHole)" />
    <!-- Pips Right Face (4) -->
    <circle cx="72" cy="52" r="4" fill="url(#pipHole)" />
    <circle cx="85" cy="46" r="4" fill="url(#pipHole)" />
    <circle cx="72" cy="85" r="4" fill="url(#pipHole)" />
    <circle cx="85" cy="79" r="4" fill="url(#pipHole)" />
  </g>

  <!-- ==================== FOREGROUND MAIN DIE ==================== -->
  <g transform="translate(145, 125) scale(1.42) rotate(14)" filter="url(#diceShadow)">
    <!-- Top Face -->
    <polygon points="55,10 102,32 55,55 8,32" fill="url(#diceTop)" stroke="#FFF" stroke-width="1.2" />
    <!-- Left Face -->
    <polygon points="8,32 55,55 55,108 8,85" fill="url(#diceLeft)" stroke="#FFF" stroke-width="1.2" />
    <!-- Right Face -->
    <polygon points="55,55 102,32 102,85 55,108" fill="url(#diceRight)" stroke="#FFF" stroke-width="1.2" />

    <!-- Pips Top Face (3 in diagonal) -->
    <circle cx="35" cy="24" r="4.5" fill="url(#pipHole)" />
    <circle cx="55" cy="32" r="4.5" fill="url(#pipHole)" />
    <circle cx="75" cy="40" r="4.5" fill="url(#pipHole)" />

    <!-- Pips Left Face (5) -->
    <circle cx="24" cy="52" r="4.5" fill="url(#pipHole)" />
    <circle cx="40" cy="62" r="4.5" fill="url(#pipHole)" />
    <circle cx="24" cy="78" r="4.5" fill="url(#pipHole)" />
    <circle cx="40" cy="88" r="4.5" fill="url(#pipHole)" />
    <circle cx="32" cy="70" r="4.5" fill="url(#pipHole)" />

    <!-- Pips Right Face (6) -->
    <circle cx="75" cy="50" r="4.5" fill="url(#pipHole)" />
    <circle cx="75" cy="68" r="4.5" fill="url(#pipHole)" />
    <circle cx="75" cy="86" r="4.5" fill="url(#pipHole)" />
    <circle cx="89" cy="44" r="4.5" fill="url(#pipHole)" />
    <circle cx="89" cy="62" r="4.5" fill="url(#pipHole)" />
    <circle cx="89" cy="80" r="4.5" fill="url(#pipHole)" />
  </g>

  <!-- ==================== BETTING RULER / SLIDER SCALE ==================== -->
  <g transform="translate(30, 360)">
    <!-- Main Scale Bar -->
    <rect x="0" y="20" width="390" height="9" rx="4.5" fill="#FF1E46" />
    <!-- Vertical Ticks -->
    <line x1="15" y1="29" x2="15" y2="48" stroke="#FF1E46" stroke-width="3.5" />
    <line x1="40" y1="29" x2="40" y2="40" stroke="#FF1E46" stroke-width="2" />
    <line x1="65" y1="29" x2="65" y2="48" stroke="#FF1E46" stroke-width="3.5" />
    <line x1="90" y1="29" x2="90" y2="40" stroke="#FF1E46" stroke-width="2" />
    <line x1="115" y1="29" x2="115" y2="48" stroke="#FF1E46" stroke-width="3.5" />
    <line x1="140" y1="29" x2="140" y2="40" stroke="#FF1E46" stroke-width="2" />
    <line x1="165" y1="29" x2="165" y2="48" stroke="#FF1E46" stroke-width="3.5" />
    <line x1="190" y1="29" x2="190" y2="40" stroke="#FF1E46" stroke-width="2" />
    <line x1="215" y1="29" x2="215" y2="48" stroke="#FF1E46" stroke-width="3.5" />
    <line x1="240" y1="29" x2="240" y2="40" stroke="#FF1E46" stroke-width="2" />
    <line x1="265" y1="29" x2="265" y2="48" stroke="#FF1E46" stroke-width="3.5" />
    <line x1="290" y1="29" x2="290" y2="40" stroke="#FF1E46" stroke-width="2" />
    <line x1="315" y1="29" x2="315" y2="48" stroke="#FF1E46" stroke-width="3.5" />
    <line x1="340" y1="29" x2="340" y2="40" stroke="#FF1E46" stroke-width="2" />
    <line x1="365" y1="29" x2="365" y2="48" stroke="#FF1E46" stroke-width="3.5" />

    <!-- Triangle Pointer on Scale -->
    <polygon points="340,3 355,-18 325,-18" fill="#FF1E46" filter="url(#diceShadow)" />
  </g>

  <!-- ==================== BOTTOM TYPOGRAPHY ==================== -->
  <!-- "DICE" Primary Title -->
  <text x="225" y="480"
        font-family="'Unbounded', 'Outfit', sans-serif"
        font-weight="900"
        font-size="54"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="0.1em">DICE</text>

  <!-- "BETZONE ORIGINALS" Subtitle -->
  <text x="225" y="525"
        font-family="'Unbounded', 'Outfit', sans-serif"
        font-weight="800"
        font-size="14.5"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="0.18em">
    <tspan fill="#FF1A4B">BETZONE</tspan> ORIGINALS
  </text>

  <!-- Bottom Bright Center Flare -->
  <ellipse cx="225" cy="590" rx="140" ry="12" fill="#FF1A4B" opacity="0.75" filter="blur(14px)" />
</svg>
