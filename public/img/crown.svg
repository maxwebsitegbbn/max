<svg viewBox="0 0 256 320" fill="none" xmlns="http://www.w3.org/2000/svg" class="crown-graphic">
  <defs>
    <filter id="crownGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="35%" stop-color="#F7C948" />
      <stop offset="70%" stop-color="#DDA110" />
      <stop offset="100%" stop-color="#916200" />
    </linearGradient>
    <linearGradient id="crownViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#D8B4FE" />
      <stop offset="100%" stop-color="#8B3DFF" />
    </linearGradient>
    <radialGradient id="gemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#BFF5D2" />
      <stop offset="100%" stop-color="#22E39A" />
    </radialGradient>
    <radialGradient id="rubyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FF7AB8" />
      <stop offset="100%" stop-color="#E11D48" />
    </radialGradient>
    <radialGradient id="sapphireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#4F46E5" />
    </radialGradient>
  </defs>
  
  <!-- Crown Base Shadow / Ambient Glow -->
  <ellipse cx="128" cy="270" rx="90" ry="24" fill="rgba(139, 61, 255, 0.4)" filter="url(#crownGlow)"/>
  
  <!-- Velvet Cap Inside Crown -->
  <path d="M48 230 C48 150, 208 150, 208 230 Z" fill="url(#crownViolet)" opacity="0.85"/>
  <path d="M128 150 L128 230" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Crown Body Back Rim -->
  <path d="M38 235 C38 215, 218 215, 218 235 C218 255, 38 255, 38 235 Z" fill="#784E00" />
  
  <!-- Main Golden Crown Structure -->
  <path d="M32 230 
           L38 120 
           L84 175 
           L128 65 
           L172 175 
           L218 120 
           L224 230 
           C224 265, 32 265, 32 230 Z" 
        fill="url(#crownGold)" 
        stroke="#FFF1B8" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#crownGlow)" />
        
  <!-- Embossed Front Band -->
  <path d="M34 225 C80 250, 176 250, 222 225 L224 245 C176 270, 80 270, 32 245 Z" fill="url(#crownGold)" stroke="#FFE885" stroke-width="2"/>

  <!-- Jewels on the Peaks -->
  <!-- Left Peak Gem -->
  <circle cx="38" cy="116" r="14" fill="url(#rubyGlow)" stroke="#FFF" stroke-width="2" />
  <circle cx="35" cy="112" r="4" fill="#FFF" opacity="0.9" />

  <!-- Center Grand Orb & Cross -->
  <circle cx="128" cy="60" r="18" fill="url(#gemGlow)" stroke="#FFF" stroke-width="2.5" />
  <circle cx="124" cy="55" r="5" fill="#FFF" opacity="0.9" />
  <path d="M128 22 L128 42 M118 30 L138 30" stroke="#FFE885" stroke-width="5" stroke-linecap="round" />

  <!-- Right Peak Gem -->
  <circle cx="218" cy="116" r="14" fill="url(#sapphireGlow)" stroke="#FFF" stroke-width="2" />
  <circle cx="215" cy="112" r="4" fill="#FFF" opacity="0.9" />

  <!-- Intermediate Peaks Jewels -->
  <circle cx="84" cy="172" r="9" fill="url(#gemGlow)" stroke="#FFF" stroke-width="1.5" />
  <circle cx="172" cy="172" r="9" fill="url(#rubyGlow)" stroke="#FFF" stroke-width="1.5" />

  <!-- Embedded Gems in Main Band -->
  <circle cx="70" cy="242" r="8" fill="url(#rubyGlow)" stroke="#FFE885" stroke-width="1.5" />
  <rect x="119" y="233" width="18" height="18" rx="4" transform="rotate(45 128 242)" fill="url(#gemGlow)" stroke="#FFF" stroke-width="2" />
  <circle cx="186" cy="242" r="8" fill="url(#sapphireGlow)" stroke="#FFE885" stroke-width="1.5" />

  <!-- Crown Sparkles -->
  <path d="M128 5 L130 15 L140 17 L130 19 L128 29 L126 19 L116 17 L126 15 Z" fill="#FFF" opacity="0.95"/>
  <path d="M48 95 L49 101 L55 102 L49 103 L48 109 L47 103 L41 102 L47 101 Z" fill="#FFF" opacity="0.8"/>
  <path d="M208 95 L209 101 L215 102 L209 103 L208 109 L207 103 L201 102 L207 101 Z" fill="#FFF" opacity="0.8"/>
</svg>